services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disputewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disputewise}
      POSTGRES_DB: ${POSTGRES_DB:-disputewise}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disputewise} -d ${POSTGRES_DB:-disputewise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disputewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disputewise}
      POSTGRES_DB: ${POSTGRES_DB:-disputewise}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_DEFAULT_PAGE_SIZE: ${API_DEFAULT_PAGE_SIZE:-25}
      API_MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE:-200}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
